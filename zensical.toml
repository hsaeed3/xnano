[project]
site_name = " "
site_url = "https://xnano.hammad.app"
site_description = "A Python terminal UI framework built on the ``ratatui`` and ``tachyonfx`` Rust crates."
site_author = "Hammad Saeed"
docs_dir = "docs"

repo_name = "hsaeed3/xnano"
repo_url = "https://github.com/hsaeed3/xnano"
copyright = """
Copyright &copy; 2026 Hammad Saeed
"""

nav = [
    {"Introduction" = "index.md"},
    {"Learn" = [
        {"Getting Started" = "learn/index.md"},
        {"Basics" = "learn/basics.md"},
    ]},
    {"Legacy v1" = [
        {"Overview" = "v1/index.md"},
        {"Getting Started" = "v1/getting-started.md"},
        {"Concepts" = "v1/core-concepts/overview.md"},
    ]},
    {"API Reference" = [
        {"API Reference" = "api-reference/index.md"},
        # API_REFERENCE_START
        {"xnano" = [
            {"xnano" = "api-reference/xnano/index.md"},
            {"xnano.audio" = "api-reference/xnano/audio.md"},
            {"xnano.buffers" = "api-reference/xnano/buffers.md"},
            {"xnano.canvas" = "api-reference/xnano/canvas.md"},
            {"xnano.context" = "api-reference/xnano/context.md"},
            {"xnano.cursor" = "api-reference/xnano/cursor.md"},
            {"xnano.demo" = "api-reference/xnano/demo.md"},
            {"xnano.effects" = "api-reference/xnano/effects.md"},
            {"xnano.errors" = "api-reference/xnano/errors.md"},
            {"xnano.events" = "api-reference/xnano/events.md"},
            {"xnano.expressions" = "api-reference/xnano/expressions.md"},
            {"xnano.geometry" = "api-reference/xnano/geometry.md"},
            {"xnano.image" = "api-reference/xnano/image.md"},
            {"xnano.input" = "api-reference/xnano/input.md"},
            {"xnano.loop" = "api-reference/xnano/loop.md"},
            {"xnano.operations" = "api-reference/xnano/operations.md"},
            {"xnano.output" = "api-reference/xnano/output.md"},
            {"xnano.pixels" = "api-reference/xnano/pixels.md"},
            {"xnano.placement" = "api-reference/xnano/placement.md"},
            {"xnano.scene" = "api-reference/xnano/scene.md"},
            {"xnano.state" = "api-reference/xnano/state.md"},
            {"xnano.styles" = "api-reference/xnano/styles.md"},
            {"xnano.terminal" = "api-reference/xnano/terminal.md"},
            {"xnano.time" = "api-reference/xnano/time.md"},
            {"xnano.types" = "api-reference/xnano/types.md"},
            {"xnano.widgets" = "api-reference/xnano/widgets.md"},
        ]},
        {"xnano-core" = [
            {"xnano_core" = "api-reference/xnano-core/index.md"},
            {"xnano_core._xnano_core" = "api-reference/xnano-core/_xnano_core.md"},
            {"xnano_core._xnano_core._core_types" = "api-reference/xnano-core/_xnano_core/_core_types.md"},
        ]},
        {"xnano-audio" = [
            {"xnano_audio" = "api-reference/xnano-audio/index.md"},
        ]},
        {"xnano-image" = [
            {"xnano_image" = "api-reference/xnano-image/index.md"},
        ]},
        # API_REFERENCE_END
    ]},
]

extra_css = [
    "stylesheets/code-theme.css",
    "stylesheets/content-layout.css",
    "stylesheets/content-media.css",
    "stylesheets/context7.css",
    "stylesheets/mkdocstrings.css",
    "stylesheets/open-props.css",
    "stylesheets/style-variants.css",
    "stylesheets/theme.css",
    "stylesheets/typography.css",
    "stylesheets/components/appearance-controls.css",
    "stylesheets/components/code-blocks.css",
    "stylesheets/components/nav.css",
    "stylesheets/components/components.css",
    "stylesheets/components/site-chrome.css",
]

[project.theme]
language = "en"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "header.autohide",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    # "navigation.prune",
    # "navigation.tabs",
    "navigation.top",
    "navigation.sections",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.theme.icon]
logo = "fontawesome/solid/x"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.font]
text = "Geist Pixel"
code = "Google Sans Code"

[[project.home.buttons]]
name = "API Reference"
url = "api-reference/index"
theme = "md-button"

[[project.home.buttons]]
name = "Getting Started"
url = "learn/index"
theme = "md-button"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/hsaeed3/xnano"
name = "xnano - GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/xnano"
name = "xnano - PyPI"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/xnano-core"
name = "xnano-core - PyPI"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/xnano-audio"
name = "xnano-audio - PyPI"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/xnano-image"
name = "xnano-image - PyPI"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/hsaeed3"
name = "Hammad Saeed - LinkedIn"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
footnotes = {}
md_in_html = {}
"mkdocs-click" = {}

[project.markdown_extensions.pymdownx]
critic = {}
details = {}
keys = {}
inlinehilite = {}

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
auto_title = false

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "material.extensions.emoji.twemoji"
emoji_generator = "material.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.toc]
permalink = true
title = "On this page"
permalink_title = "Anchor link to this section for reference"

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

