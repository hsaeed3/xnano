name: CI

on:
  push:
    branches:
      - main
    # one tag per package: xnano/v2.0.0, xnano-core/v1.0.0, xnano-audio/v0.1.0, ...
    tags:
      - 'xnano/v*'
      - 'xnano-core/v*'
      - 'xnano-audio/v*'
      - 'xnano-image/v*'
  pull_request: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COLUMNS: 150
  FORCE_COLOR: 1
  UV_FROZEN: true
  UV_PYTHON: '3.13'

permissions:
  contents: read

jobs:
  # decides what to build; see .github/scripts/resolve_release.py
  plan:
    name: resolve release plan # the required status check on main is named after this job
    runs-on: ubuntu-latest
    outputs:
      full_build: ${{ steps.plan.outputs.full_build }}
      core_packages: ${{ steps.plan.outputs.core_packages }}
      build_xnano: ${{ steps.plan.outputs.build_xnano }}
      release: ${{ steps.plan.outputs.release }}
      package: ${{ steps.plan.outputs.package }}
      version: ${{ steps.plan.outputs.version }}
      is_prerelease: ${{ steps.plan.outputs.is_prerelease }}
      already_published: ${{ steps.plan.outputs.already_published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - id: plan
        run: uv run --script .github/scripts/resolve_release.py
        env:
          HAS_FULL_BUILD_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full build') }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions

      # `xnano-audio` links the system ALSA library on linux (alsa-sys finds it with pkg-config)
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - run: uv sync --all-packages --all-groups --no-group docs --all-extras

      - run: make lint-all

      - run: make spellcheck

      - run: make typecheck

  test:
    name: Test ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        include:
          - os: macos-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # builds the three workspace packages (`xnano-core`, `xnano-audio`, `xnano-image`) in development mode
      - run: uv sync --all-packages --all-groups --no-group docs --all-extras

      # `make` is not available on the windows runner, so the suites are run directly
      - name: Test the pure Rust crates
        run: cargo test -p xnano-terminal-cells -p xnano-terminal-state -p xnano-terminal-runtime

      - name: Test the Python packages
        shell: bash
        run: |
          uv run --no-sync pytest tests
          for package in xnano-core xnano-audio xnano-image; do
            (cd "packages/$package" && uv run --no-sync pytest)
          done

      - name: Install development terminal tools
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        run: sudo apt-get install -y kitty xvfb xauth libgl1-mesa-dri fonts-dejavu-core

      - name: Test an actual terminal application
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        run: make test-terminal

      - name: Upload native terminal screens and logs
        if: always() && runner.os == 'Linux' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-terminal
          path: .artifacts/terminal/
          if-no-files-found: ignore

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions

      # fails when a module was added, renamed or removed without regenerating its page
      - run: python3 scripts/docs/autogenerate_api_references.py --check

      # the docs read the API from the package sources, so no package or Rust build is needed.
      # strict: any docstring cross-reference that does not resolve fails the build
      - run: make docs-build

  core-build-sdist:
    name: ${{ matrix.package }} / Build sdist
    needs: [plan]
    if: needs.plan.outputs.full_build == 'true' && needs.plan.outputs.core_packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.core_packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: packages/${{ matrix.package }}
          command: sdist
          args: --out dist
          rust-toolchain: stable

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi_files_${{ matrix.package }}_sdist
          path: packages/${{ matrix.package }}/dist

  core-build:
    name: ${{ matrix.package }} / Build ${{ matrix.platform.os }} ${{ matrix.platform.target }}${{ matrix.platform.manylinux && format(' ({0})', matrix.platform.manylinux) || '' }}
    needs: [plan]
    if: needs.plan.outputs.full_build == 'true' && needs.plan.outputs.core_packages != '[]'
    runs-on: ${{ matrix.platform.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.core_packages) }}
        platform:
          # aarch64 linux wheels are built on native arm runners, so the audio package can
          # install the ALSA headers inside the build container instead of cross compiling.
          - { os: linux, runs-on: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: linux, runs-on: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { os: linux, runs-on: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: linux, runs-on: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos, runs-on: macos-latest, target: x86_64 }
          - { os: macos, runs-on: macos-latest, target: aarch64 }
          - { os: windows, runs-on: windows-latest, target: x86_64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.13'
          enable-cache: false

      # `xnano-audio` links the system ALSA library (cpal -> alsa-sys) on linux. The
      # headers are installed in the build container, and libasound is deliberately not
      # bundled into the wheel: the system copy finds the distribution's ALSA plugins
      # (PipeWire / PulseAudio routing), which a bundled copy would not. A machine without
      # libasound cannot import the package, which xnano treats as "no audio".
      # Skipping the audit also skips the platform tag it assigns, which PyPI requires, so
      # the tag is stated explicitly: the build container is manylinux2014.
      #
      # The musllinux build containers cross compile with a musl toolchain whose pkg-config
      # sysroot cannot see the (glibc) ALSA headers, so musllinux audio wheels are built
      # without the `playback` feature: synthesis works and the device classes report that
      # they are unavailable.
      - name: Select the build options
        id: build-options
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          OS: ${{ matrix.platform.os }}
          MANYLINUX: ${{ matrix.platform.manylinux }}
        run: |
          if [ "$PACKAGE" = "xnano-audio" ] && [ "$MANYLINUX" = "musllinux_1_2" ]; then
            echo "extra-args=--no-default-features" >> "$GITHUB_OUTPUT"
            echo "before-script=" >> "$GITHUB_OUTPUT"
          elif [ "$PACKAGE" = "xnano-audio" ] && [ "$OS" = "linux" ]; then
            echo "extra-args=--auditwheel skip --compatibility manylinux2014" >> "$GITHUB_OUTPUT"
            echo 'before-script=(command -v apk && apk add --no-cache alsa-lib-dev pkgconf) || (command -v dnf && dnf install -y alsa-lib-devel pkgconfig) || (command -v yum && yum install -y alsa-lib-devel pkgconfig) || (apt-get update && apt-get install -y libasound2-dev pkg-config)' >> "$GITHUB_OUTPUT"
          else
            echo "extra-args=" >> "$GITHUB_OUTPUT"
            echo "before-script=" >> "$GITHUB_OUTPUT"
          fi

      # every extension is `abi3-py310`, so one wheel per platform covers python 3.10+
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: packages/${{ matrix.package }}
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist --interpreter 3.10 ${{ steps.build-options.outputs.extra-args }}
          before-script-linux: ${{ steps.build-options.outputs.before-script }}
          rust-toolchain: stable
          docker-options: -e CI

      - run: ls -lh dist/
        shell: bash
        working-directory: packages/${{ matrix.package }}

      # PyPI rejects a plain `linux_*` platform tag, so fail here instead of at the upload.
      - name: Check the platform tags
        shell: bash
        working-directory: packages/${{ matrix.package }}
        run: |
          if ls dist/*-linux_*.whl > /dev/null 2>&1; then
            echo "::error::A wheel has a plain linux platform tag, which PyPI rejects. Build it with a manylinux or musllinux tag."
            ls dist/*-linux_*.whl
            exit 1
          fi

      - run: uvx twine check --strict dist/*
        shell: bash
        working-directory: packages/${{ matrix.package }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi_files_${{ matrix.package }}_${{ matrix.platform.os }}_${{ matrix.platform.target }}_${{ matrix.platform.manylinux || 'native' }}
          path: packages/${{ matrix.package }}/dist

  core-test-wheels:
    name: ${{ matrix.package }} / Test wheel on ${{ matrix.os }}
    needs: [plan, core-build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.core_packages) }}
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.13'
          enable-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pypi_files_${{ matrix.package }}_*
          merge-multiple: true
          path: dist

      - name: Install the wheel into a clean environment and import it
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          uv venv
          uv pip install "$PACKAGE" --no-index --no-deps --find-links dist --force-reinstall
          if [ "$PACKAGE" = "xnano-core" ]; then
            uv run --no-project --no-sync python -c "import xnano_core._xnano_core as core, xnano_core._xnano_core._core_types as types; print(core.__version__); print(core.Buffer(width=4, height=1))"
          else
            uv run --no-project --no-sync python -c "import ${PACKAGE//-/_} as module; print(module.__name__)"
          fi

  # Pyodide / Emscripten build of `xnano-core`.
  #
  # - crossterm does not support Emscripten, so the build disables the default `terminal`
  #   feature (`--no-default-features`); wasm sessions are buffer backed and offscreen only.
  # - `xnano-audio` (cpal) and `xnano-image` are not built for wasm.
  # - the python version must match `pyodide config get python_version` for the pyodide release.
  # - the rust toolchain must be at least the workspace MSRV (1.88) and compatible with the
  #   emscripten version of the pyodide cross-build environment.
  core-build-wasm:
    name: xnano-core / Build wasm (Pyodide)
    needs: [plan]
    if: needs.plan.outputs.full_build == 'true' && contains(fromJSON(needs.plan.outputs.core_packages), 'xnano-core')
    runs-on: ubuntu-latest
    env:
      RUST_TOOLCHAIN: '1.93.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: false

      # `pyodide-build` ships no executables itself; the `pyodide` command comes from `pyodide-cli`
      - run: uv tool install pyodide-cli --with pyodide-build

      - name: Install the rust toolchain and the emscripten target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add wasm32-unknown-emscripten --toolchain "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning] -- the cache holds only build intermediates, never the published wheel

      - name: Build the wasm wheel
        working-directory: packages/xnano-core
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
        run: pyodide build -o dist -C build-args="--no-default-features"

      - run: uvx twine check --strict packages/xnano-core/dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi_files_xnano-core_pyemscripten
          path: packages/xnano-core/dist

  core-test-wasm:
    name: xnano-core / Test wasm wheel in Pyodide
    needs: [core-build-wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.14'
          enable-cache: false

      # `pyodide-build` ships no executables itself; the `pyodide` command comes from `pyodide-cli`
      - run: uv tool install pyodide-cli --with pyodide-build

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi_files_xnano-core_pyemscripten
          path: dist

      - run: pyodide venv .venv-pyodide

      - run: .venv-pyodide/bin/pip install xnano-core --no-index --no-deps --find-links dist

      - run: .venv-pyodide/bin/python .github/scripts/wasm_smoke_test.py

  build-xnano:
    name: xnano / Build sdist and wheel
    needs: [plan]
    if: needs.plan.outputs.full_build == 'true' && needs.plan.outputs.build_xnano == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      # `--no-sources` builds against the published packages, as users will install them
      - run: uv build --no-sources --out-dir dist

      - run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi_files_xnano
          path: dist

  # https://github.com/marketplace/actions/alls-green
  check: # does nothing except give branch protection a single required job
    if: always()
    needs:
      - plan
      - lint
      - test
      - docs
      - core-build-sdist
      - core-build
      - core-test-wheels
      - core-build-wasm
      - core-test-wasm
      - build-xnano
    outputs:
      result: ${{ steps.all-green.outputs.result }}
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        id: all-green
        with:
          jobs: ${{ toJSON(needs) }}
          # the build jobs only run for full builds
          allowed-skips: core-build-sdist, core-build, core-test-wheels, core-build-wasm, core-test-wasm, build-xnano

  release-core:
    name: ${{ needs.plan.outputs.package }} / Release
    needs: [plan, check]
    # `!cancelled()` replaces the implicit `success()`, which also fails when any job `check`
    # depends on was skipped (a tag only builds the package it releases). `check` reports that.
    if: >-
      !cancelled() &&
      needs.check.outputs.result == 'success' &&
      needs.plan.outputs.release == 'true' &&
      needs.plan.outputs.package != 'xnano'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
      pull-requests: read
    steps:
      # the full history and every tag, to find the pull requests since the previous release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pypi_files_${{ needs.plan.outputs.package }}_*
          merge-multiple: true
          path: dist

      - name: Test the distributions
        run: |
          for wheel in dist/*.whl; do unzip -qt "$wheel"; done
          uvx twine check --strict dist/*

      - name: Publish to PyPI
        if: needs.plan.outputs.already_published != 'true'
        run: uv publish dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: Write the release notes
        run: uv run --script .github/scripts/release_notes.py "$GITHUB_REF_NAME" release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.plan.outputs.package }} ${{ needs.plan.outputs.version }}
          prerelease: ${{ needs.plan.outputs.is_prerelease }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: dist/*

  release-xnano:
    name: xnano / Release
    needs: [plan, check]
    # `!cancelled()` replaces the implicit `success()`, which also fails when any job `check`
    # depends on was skipped (a tag only builds the package it releases). `check` reports that.
    if: >-
      !cancelled() &&
      needs.check.outputs.result == 'success' &&
      needs.plan.outputs.release == 'true' &&
      needs.plan.outputs.package == 'xnano'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
      pull-requests: read
    steps:
      # the full history and every tag, to find the pull requests since the previous release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi_files_xnano
          path: dist

      - name: Test the distributions
        run: |
          for wheel in dist/*.whl; do unzip -qt "$wheel"; done
          uvx twine check --strict dist/*

      - name: Publish to PyPI
        if: needs.plan.outputs.already_published != 'true'
        run: uv publish dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: Write the release notes
        run: uv run --script .github/scripts/release_notes.py "$GITHUB_REF_NAME" release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: xnano ${{ needs.plan.outputs.version }}
          prerelease: ${{ needs.plan.outputs.is_prerelease }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: dist/*
