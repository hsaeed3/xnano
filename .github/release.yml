changelog:
  exclude:
    labels:
      - relnotes-ignore
      - documentation
      - dependencies
  categories:
    - title: Packaging
      labels:
        - relnotes-packaging
    - title: New Features
      labels:
        - relnotes-feature
    - title: Changes
      labels:
        - relnotes-change
    - title: Performance
      labels:
        - relnotes-performance
    - title: Fixes
      labels:
        - relnotes-fix
    # a pull request without a release-notes label is still listed
    - title: Other Changes
      labels:
        - '*'
