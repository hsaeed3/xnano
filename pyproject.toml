# !!! important
#   From the `v2` and onwards versions of `xnano`, this file now builds the package as a
#   no-code wheel that installs the collective set of `xnano-*` subpackages within this
#   repository.
#
#   The `xnano` namespace is now completely implemented by `xnano-core`; the root
#   `xnano` name is used to create its modular dependency tree. (ex. `xnano[audio]`)
[build-system]
requires = ['hatchling>=1.27']
build-backend = 'hatchling.build'

# this allows xnano's wheel to be built completely empty by hatchling.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv]
managed = true

[tool.uv.workspace]
members = ['packages/*']

[tool.uv.sources]
xnano-core = { workspace = true }
xnano-audio = { workspace = true }
xnano-image = { workspace = true }

[project]
name = 'xnano'
readme = 'README.md'
description = 'A simple python **tui** framework built on top of the ``[ratatui](https://ratatui.rs)`` and ``[tachyonfx](https://github.com/ratatui/tachyonfx)`` rust crates.'
license = {'file' = 'LICENSE'}
authors = [{ name = 'Hammad Saeed', email = 'hammad@supportvectors.com' }]
requires-python = '>=3.10,<3.15'
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: Unix",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Environment :: MacOS X",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
    "Programming Language :: Python :: Implementation",
]
# `xnano's` version and subpackage pins are automatically generated by the `build.rs` file within
# the `crates/xnano-terminal-runtime` directory.
# the section below follows a similar pattern to pydantic's monty package:
# [pyproject.toml](https://github.com/pydantic/monty/blob/main/packages/pydantic-monty/pyproject.toml),
#
# [! AUTO-VERSIONING - DO NOT EDIT THIS BY HAND]
version = '2.0.0b1'
dependencies = [
    "xnano-core>=2.0.0b1",
    "xnano-audio>=0.1.0,<0.2",
    "xnano-image>=0.1.0,<0.2",
]
# [! END AUTO-VERSIONING]

[dependency-groups]
dev = [
    "maturin>=1.15.0,<2",
    "basedpyright>=1.34.0",
    # replaces 'pre-commit' (native-python, requires no additional install)
    "prek>=0.5.4",
    "griffe",
    "ruff>=0.16.10",
    "pytest>=9.0.3",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "inline-snapshot",
]
codspeed = [
    'pytest-codspeed; python_version == "3.13" and implementation_name == "cpython"',
]
docs = [
    "zensical>=0.0.50",
    "termynal>=0.14.0",
    "griffe-typingdoc",
    "mkdocs-material",
    "mkdocs-click",
    "mkdocstrings-python",
    "markdown-exec[ansi]",
]
# used by the `xnano.v1` API (markdown rendering, syntax highlighting and
# field validation).
v1 = [
    'markdown-it-py>=3.0.0',
    'pydantic-core>=2.0.0',
    'pygments>=2.17.0',
]

[tool.codespell]
# `ratatui` and `iTerm2` are proper names; the rest are intentional identifiers
# (a `shft` key alias, a fraction's `numer`ator, the `NotIn` AST node, ...).
ignore-words-list = 'ratatui,iterm,shft,numer,nd,abd,notin,trough'

[tool.coverage.run]
source = ['xnano']
branch = true
relative_files = true
context = '${CONTEXT}'

[tool.pytest.ini_options]
pythonpath = ['tests']
# A bare `pytest` runs the test suite only. The CodSpeed benchmark suite lives
# in `tests/benchmarks/` and is opted into explicitly (`pytest benchmarks --codspeed`).
testpaths = ['tests']
# Default discovery excludes common build/venv dirs only.
norecursedirs = [
    '.*',
    'build',
    'dist',
    'CVS',
    '_darcs',
    '{arch}',
    '*.egg',
    'venv',
]

#
[tool.basedpyright]
include = ['packages']
exclude = ['**/__pycache__', '**/.venv', '**/target']
pythonVersion = '3.10'
typeCheckingMode = 'standard'
reportMissingModuleSource = false

# v1 is a dynamic compatibility port of the former Pydantic/dataclass API.
# Keep type checking strict for the new packages and exercise v1 through its
# runtime compatibility suite; its dynamic component/schema adapters cannot
# be represented faithfully by basedpyright's static model.
[[tool.basedpyright.executionEnvironments]]
root = 'packages/xnano-core/src/xnano/v1'
reportArgumentType = false
reportAssignmentType = false
reportAttributeAccessIssue = false
reportCallIssue = false
reportGeneralTypeIssues = false
reportIncompatibleVariableOverride = false
reportInconsistentOverload = false
reportInvalidTypeForm = false
reportInvalidTypeVarUse = false
reportMissingImports = false
reportReturnType = false
reportSelfClsParameterName = false

# Tests pass invalid values on purpose and read optional results they have just asserted.
[[tool.basedpyright.executionEnvironments]]
root = 'packages/xnano-core/tests'
extraPaths = ['packages/xnano-core/tests']
reportArgumentType = false
reportCallIssue = false
reportIndexIssue = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportUnusedExpression = false

[[tool.basedpyright.executionEnvironments]]
root = 'packages/xnano-audio/tests'
extraPaths = ['packages/xnano-audio/tests']
reportArgumentType = false
reportCallIssue = false
reportIndexIssue = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportUnusedExpression = false

[[tool.basedpyright.executionEnvironments]]
root = 'packages/xnano-image/tests'
extraPaths = ['packages/xnano-image/tests']
reportArgumentType = false
reportCallIssue = false
reportIndexIssue = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportUnusedExpression = false

[[tool.basedpyright.executionEnvironments]]
root = 'packages/xnano-audio/benchmarks'
extraPaths = ['packages/xnano-audio/benchmarks']
reportArgumentType = false
reportCallIssue = false
reportIndexIssue = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportUnusedExpression = false

[[tool.basedpyright.executionEnvironments]]
root = 'packages/xnano-image/benchmarks'
extraPaths = ['packages/xnano-image/benchmarks']
reportArgumentType = false
reportCallIssue = false
reportIndexIssue = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportUnusedExpression = false

[tool.ruff.lint]
preview = true
select = [
    'F',      # Pyflakes
    'E',      # pycodestyle (Error)
    'I',      # isort
    'D',      # pydocstyle
    'D213',   # multi-line docstrings start on the line after the opening quotes
    'UP',     # pyupgrade
    'YTT',    # flake8-2020
    'B',      # flake8-bugbear
    'T10',    # flake8-debugger
    'T20',    # flake8-print
    'C4',     # flake8-comprehensions
    'PERF',   # Perflint
    'PIE',    # flake8-pie
    'PYI006', # flake8-pyi
    'PYI062', # flake8-pyi
    'PYI063', # flake8-pyi
    'PYI066', # flake8-pyi
]
ignore = ['D105', 'D107', 'D205', 'D212', 'D415', 'E501', 'B011', 'B028', 'B904', 'PIE804']
flake8-quotes = {inline-quotes = 'single', multiline-quotes = 'double'}
mccabe = { max-complexity = 14 }
pydocstyle = { convention = 'google' }

[tool.ruff.lint.per-file-ignores]
# Stubs declare `__repr__` so type checkers and the stub contract tests see it.
'*.pyi' = ['PYI029']

[tool.ruff.lint.isort]
known-first-party = ["xnano"]
# pydantic-core is no longer a dependency installed by default with xnano, but is included
# in the legacy `xnano.v1` submodule.
known-third-party = ["pydantic_core", "xnano_audio", "xnano_image"]
# Automatic spacing (-1):
# - 1 blank line between the last runtime import and `if TYPE_CHECKING:`
# - 2 blank lines after the import / TYPE_CHECKING block before top-level
#   content (class / function / assignment)
# Forced `2` incorrectly puts two blanks *before* TYPE_CHECKING as well.
lines-after-imports = -1
no-lines-before = ["local-folder"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
