version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python-dependencies:
        patterns:
          - '*'
    ignore:
      # the workspace packages are released by hand, in lockstep with their Rust
      # crates, so dependabot must never bump their pins
      - dependency-name: 'xnano'
      - dependency-name: 'xnano-core'
      - dependency-name: 'xnano-audio'
      - dependency-name: 'xnano-image'
    cooldown:
      default-days: 7

  # one Cargo workspace: a single entry updates every crate in it
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      rust-dependencies:
        patterns:
          - '*'
        exclude-patterns:
          # pyo3 upgrades touch every binding, so they are done by hand
          - 'pyo3*'
    cooldown:
      default-days: 7
