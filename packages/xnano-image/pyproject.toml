[build-system]
requires = ['maturin>=1.15.0,<2']
build-backend = 'maturin'

[tool.maturin]
manifest-path = "../../crates/xnano-terminal-image/Cargo.toml"
features = ["pyo3/extension-module"]
module-name = "xnano_image._xnano_image"
python-source = "src/"
bindings = "pyo3"
strip = true
package = true

[tool.maturin.env]
PYO3_USE_ABI3_FORWARD_COMPATIBILITY = "1"
MACOSX_DEPLOYMENT_TARGET = "11.0"

[project]
name = "xnano-image"
dynamic = ["version"]
authors = [{ name = "Hammad Saeed", email = "hammad@supportvectors.com" }]
description = "Image & animation loading, processing & display support for the xnano terminal library."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/hsaeed3/xnano"
Source = "https://github.com/hsaeed3/xnano"
Documentation = "https://xnano.dev"

[dependency-groups]
dev = [
    # builds the rust extensions (`make build-dev`, `make rebuild-rust`)
    "maturin>=1.15.0,<2",
    # replaces 'pre-commit' (native-python, requires no additional install)
    "prek>=0.5.4",
    "ruff>=0.16.10",
    # type checking
    "basedpyright>=1.34.0",
    "pytest>=9.0.3",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "inline-snapshot",
    # used for terminal-backend benchmarking against native python libraries
    "textual",
    "pytermgui",
    "urwid",
    "psutil",
]
codspeed = [
    'pytest-codspeed; python_version == "3.13" and implementation_name == "cpython"',
]

[tool.ruff]
line-length = 90
target-version = 'py310'

[tool.ruff.format]
line-ending = 'auto'
quote-style = 'single'

[tool.ruff.lint]
# D209/D213: multi-line docstrings put both the opening and closing quotes on their own line.
extend-select = ['Q', 'RUF100', 'C90', 'I', 'UP', 'D209', 'D213']
extend-ignore = [
    'E721', # using type() instead of isinstance() - we use this in tests
]
flake8-quotes = { inline-quotes = 'single', multiline-quotes = 'double' }
mccabe = { max-complexity = 13 }
isort = { known-first-party = ['xnano_image', 'tests'] }

[tool.ruff.lint.per-file-ignores]
# Stubs declare `__repr__` so type checkers and the stub contract tests see it.
'*.pyi' = ['PYI029']

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pytest.ini_options]
# `pytest` runs the test suite; benchmarks run with `make benchmark`.
testpaths = ["tests"]

[tool.coverage.run]
source = ['xnano_image']
branch = true

[tool.coverage.report]
precision = 2
exclude_also = [
    'raise\sNotImplementedError',
    '@(typing\.)?overload',
    'class .*\bProtocol\):',
    '(typing\.)?.assert_never',
]

[tool.inline-snapshot.shortcuts]
fix = ["create", "fix"]

[tool.uv]
package = true
required-version = '>=0.7.2'
cache-keys = [
    { file = "pyproject.toml" },
    { file = "../../Cargo.toml" },
    { file = "../../Cargo.lock" },
    { dir = "../../crates" },
    { dir = "src" },
    { env = "MATURIN_PEP517_ARGS" },
    { env = "RUSTFLAGS" }
]