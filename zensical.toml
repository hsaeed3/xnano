[project]
site_name = "xnano"
site_url = "https://xnano.hammad.app"
site_description = "A Python terminal UI framework built on the ``ratatui`` and ``tachyonfx`` Rust crates."
site_author = "Hammad Saeed"
docs_dir = "docs"

repo_name = "hsaeed3/xnano"
repo_url = "https://github.com/hsaeed3/xnano"
copyright = """
Copyright &copy; 2026 Hammad Saeed
"""

nav = [
    {"Introduction" = "index.md"},
    {"API Reference" = [
        {"API Reference" = "api-reference/index.md"},
        # API_REFERENCE_START
        {"xnano" = [
            {"xnano" = "api-reference/xnano/index.md"},
            {"xnano.ai" = "api-reference/xnano/ai.md"},
            {"xnano.ai.assets" = "api-reference/xnano/ai/assets.md"},
            {"xnano.ai.capabilities" = "api-reference/xnano/ai/capabilities.md"},
            {"xnano.ai.models" = "api-reference/xnano/ai/models.md"},
            {"xnano.ai.models.art" = "api-reference/xnano/ai/models/art.md"},
            {"xnano.ai.models.components" = "api-reference/xnano/ai/models/components.md"},
            {"xnano.ai.models.decisions" = "api-reference/xnano/ai/models/decisions.md"},
            {"xnano.ai.models.music" = "api-reference/xnano/ai/models/music.md"},
            {"xnano.ai.models.state" = "api-reference/xnano/ai/models/state.md"},
            {"xnano.ai.models.text" = "api-reference/xnano/ai/models/text.md"},
            {"xnano.ai.testing" = "api-reference/xnano/ai/testing.md"},
            {"xnano.art" = "api-reference/xnano/art.md"},
            {"xnano.audio" = "api-reference/xnano/audio.md"},
            {"xnano.buffers" = "api-reference/xnano/buffers.md"},
            {"xnano.canvas" = "api-reference/xnano/canvas.md"},
            {"xnano.components" = "api-reference/xnano/components.md"},
            {"xnano.demo" = "api-reference/xnano/demo.md"},
            {"xnano.devices" = "api-reference/xnano/devices.md"},
            {"xnano.effects" = "api-reference/xnano/effects.md"},
            {"xnano.errors" = "api-reference/xnano/errors.md"},
            {"xnano.events" = "api-reference/xnano/events.md"},
            {"xnano.expressions" = "api-reference/xnano/expressions.md"},
            {"xnano.hooks" = "api-reference/xnano/hooks.md"},
            {"xnano.layout" = "api-reference/xnano/layout.md"},
            {"xnano.operations" = "api-reference/xnano/operations.md"},
            {"xnano.sandbox" = "api-reference/xnano/sandbox.md"},
            {"xnano.state" = "api-reference/xnano/state.md"},
            {"xnano.styles" = "api-reference/xnano/styles.md"},
            {"xnano.symbols" = "api-reference/xnano/symbols.md"},
            {"xnano.terminal" = "api-reference/xnano/terminal.md"},
            {"xnano.widgets" = "api-reference/xnano/widgets.md"},
        ]},
        {"xnano-core" = [
            {"xnano_core" = "api-reference/xnano-core/index.md"},
            {"xnano_core._xnano_core" = "api-reference/xnano-core/_xnano_core.md"},
            {"xnano_core._xnano_core._core_types" = "api-reference/xnano-core/_xnano_core/_core_types.md"},
        ]},
        {"xnano-audio" = [
            {"xnano_audio" = "api-reference/xnano-audio/index.md"},
        ]},
        {"xnano-image" = [
            {"xnano_image" = "api-reference/xnano-image/index.md"},
        ]},
        # API_REFERENCE_END
    ]},
    {"Legacy v1" = [
        {"Overview" = "v1/index.md"},
        {"Getting Started" = "v1/getting-started.md"},
        {"Concepts" = "v1/core-concepts/overview.md"},
    ]},
]

extra_css = [
    "stylesheets/editorial/tokens.css",
    "stylesheets/editorial/base.css",
    "stylesheets/editorial/chrome.css",
    "stylesheets/editorial/content.css",
    "stylesheets/editorial/home.css",
]

extra_javascript = [
    "js/construction.js",
    "js/context7.js",
    "js/code-notes.js",
    "js/heading-box.js",
]

[project.theme]
language = "en"
custom_dir = "overrides"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    # "navigation.prune",
    # "navigation.tabs",
    "navigation.top",
    "navigation.sections",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.theme.icon]
logo = "fontawesome/solid/x"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.font]
text = "Geist"
code = "Geist Mono"

[[project.home.buttons]]
name = "API Reference"
url = "api-reference/index"
theme = "md-button"

[[project.home.buttons]]
name = "Getting Started"
url = "learn/index"
theme = "md-button"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/hsaeed3/xnano"
name = "xnano - GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/xnano"
name = "xnano - PyPI"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/xnano-core"
name = "xnano-core - PyPI"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/xnano-audio"
name = "xnano-audio - PyPI"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/xnano-image"
name = "xnano-image - PyPI"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/hsaeed3"
name = "Hammad Saeed - LinkedIn"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
footnotes = {}
md_in_html = {}
# reads `<comments>` after code blocks, see docs/js/code-notes.js
xnano_docs_markdown = {}
"mkdocs-click" = {}

[project.markdown_extensions.pymdownx]
critic = {}
details = {}
keys = {}
inlinehilite = {}

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
linenums = true
# keeps the title as the header above the code, and line numbers out of copied text
linenums_style = "pymdownx-inline"
line_spans = "__span"
pygments_lang_class = true
auto_title = false

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "material.extensions.emoji.twemoji"
emoji_generator = "material.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.toc]
permalink = true
title = "On this page"
permalink_title = "Anchor link to this section for reference"

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

