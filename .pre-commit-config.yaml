default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
        exclude: '^uv\.lock$'

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.23.1
    hooks:
      - id: zizmor

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch # prevents direct commits to the main branch
      - id: check-yaml
        args: ['--unsafe']
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v1.7.3
    hooks:
      - id: tombi-lint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        name: Run Linter Check (Ruff)
        args: [--fix]
      - id: ruff-format
        name: Run Formatter (Ruff)

  - repo: local
    hooks:
      - id: lint
        name: Lint python (make lint)
        entry: make lint
        types: [python]
        language: system
        pass_filenames: false
      - id: lint-rust
        name: Lint rust (make lint-rust)
        entry: make lint-rust
        types: [rust]
        language: system
        pass_filenames: false
      - id: typecheck
        name: Typecheck (make typecheck)
        entry: make typecheck
        types_or: [python, pyi, rust]
        language: system
        pass_filenames: false
      # Formatting, lints, spelling and types across every package; the test suites run in CI
      - id: check
        name: Check (format, lint, spelling and types)
        entry: make lint-all spellcheck typecheck
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
