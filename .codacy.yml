---
exclude_paths:
  # Rust is checked with cargo clippy across every workspace target.
  - "crates/**"
  - "Cargo.lock"
  - "examples/**"
  - "scripts/**"
  - "packages/*/tests/**"
  - "crates/*/tests/**"
  - "packages/*/benchmarks/**"
  - "docs/**"
  - "*.md"
  - "**/*.md"
  - "**/*.js"
  - "**/*.lock"
