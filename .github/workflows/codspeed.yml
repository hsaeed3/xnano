name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request: {}
  # lets CodSpeed trigger a run to seed the initial baseline
  workflow_dispatch: {}

concurrency:
  group: codspeed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COLUMNS: 150
  UV_FROZEN: true
  UV_PYTHON: '3.13'

permissions:
  contents: read

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OpenID Connect authentication with CodSpeed
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: false # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true # zizmor: ignore[cache-poisoning] -- Job does not produce release artifacts and does not have sensitive permissions

      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # builds the workspace packages, so the benchmarks measure this commit's
      # rust crates rather than a PyPI release
      - run: uv sync --all-packages --group dev --group codspeed --all-extras
        env:
          RUST_BACKTRACE: 1

      - uses: CodSpeedHQ/action@c4fd08a3a159bd0cc208da1e0edf32b8c47d75e5 # v5.4.0
        with:
          mode: simulation
          run: >-
            uv run --no-sync pytest --codspeed
            benchmarks
            packages/xnano-core/benchmarks
            packages/xnano-image/benchmarks
            packages/xnano-audio/benchmarks
