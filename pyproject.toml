# !!! important
#   From the `v2` and onwards versions of `xnano`, this file builds the `xnano` package
#   (the `xnano/` directory at the repository root) and installs the collective set of
#   `xnano-*` subpackages within this repository as its dependencies.
#
#   The terminal runtime itself is implemented by `xnano-core`, which installs the
#   `xnano_core` import package.
[build-system]
requires = ['hatchling>=1.27']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['xnano']

[tool.hatch.build.targets.sdist]
exclude = ['/docs']

[tool.uv]
managed = true

[tool.uv.workspace]
members = ['packages/*']

[tool.uv.sources]
xnano-core = { workspace = true }
xnano-audio = { workspace = true }
xnano-image = { workspace = true }
xnano-docs-markdown = { path = "scripts/docs_markdown", editable = true }

[project]
name = 'xnano'
readme = 'README.md'
description = 'A simple python **tui** framework built on top of the ``[ratatui](https://ratatui.rs)`` and ``[tachyonfx](https://github.com/ratatui/tachyonfx)`` rust crates.'
license = {'file' = 'LICENSE'}
authors = [{ name = 'Hammad Saeed', email = 'hammad@supportvectors.com' }]
requires-python = '>=3.10,<3.15'
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: Unix",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Environment :: MacOS X",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
    "Programming Language :: Python :: Implementation",
]
# `xnano's` version and subpackage pins are automatically generated by the `build.rs` file within
# the `crates/xnano-terminal-runtime` directory.
# the section below follows a similar pattern to pydantic's monty package:
# [pyproject.toml](https://github.com/pydantic/monty/blob/main/packages/pydantic-monty/pyproject.toml),
#
# [! AUTO-VERSIONING - DO NOT EDIT THIS BY HAND]
version = '2.1.1'
dependencies = [
    "xnano-core>=2.1.3",
]

[project.optional-dependencies]
audio = [
    "xnano-audio>=0.4.1,<0.5",
]
image = [
    "xnano-image>=0.2.0,<0.3",
]
# [! END AUTO-VERSIONING]
# extras that are not `xnano-*` packages stay below the generated block, which rewrites only
# the extras above.
monty = [
    "pydantic-monty>=1.2.0",
]
# language models, decision models and agents (`xnano.ai`); pydantic-ai needs Python 3.11.
ai = [
    "pydantic-ai-slim[openrouter,typesafe]>=2.55; python_version >= '3.11'",
    "pydantic-monty>=1.2.0",
]

[project.scripts]
xnano = 'xnano.__main__:main'

[dependency-groups]
dev = [
    "maturin>=1.15.0,<2",
    "basedpyright>=1.34.0",
    # replaces 'pre-commit' (native-python, requires no additional install)
    "prek>=0.5.4",
    "griffe",
    "ruff>=0.16.10",
    "pytest>=9.0.3",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "inline-snapshot",
    # CPU and memory logging for tests and benchmarks (`pytest --resource-log`)
    "psutil>=5.9.0",
    # a terminal emulator, so tests can read the screen of a live terminal
    "pyte>=0.8.2",
    # runs the `_async` tests on an event loop
    "pytest-asyncio>=1.2.0",
]
codspeed = [
    'pytest-codspeed; python_version == "3.13" and implementation_name == "cpython"',
]
docs = [
    "zensical>=0.0.50",
    "termynal>=0.14.0",
    "griffe-typingdoc",
    "mkdocs-material",
    "mkdocs-click",
    "mkdocstrings-python",
    "markdown-exec[ansi]",
    # reads `<comments>` after code blocks (scripts/docs_markdown)
    "xnano-docs-markdown",
]
compare = [
    "prompt-toolkit>=3.0.53",
    "rich>=15.0.0",
    "urwid>=4.2.5",
]

[tool.codespell]
# `ratatui` and `iTerm2` are proper names; the rest are intentional identifiers
# (a `shft` key alias, a fraction's `numer`ator, the `NotIn` AST node, a text cut one cell short in a test, ...).
ignore-words-list = 'ratatui,iterm,shft,numer,nd,abd,notin,trough,insid'

[tool.coverage.run]
source = ['xnano', 'xnano_core', 'xnano_audio', 'xnano_image']
branch = true
relative_files = true
context = '${CONTEXT}'

[tool.pytest.ini_options]
# The CodSpeed benchmark suites live in `packages/<name>/benchmarks/` and run with
# `pytest --codspeed <paths>`. Each package's test suite runs from its own directory:
# the packages reuse module names (`helpers`, `test_contract`), which one pytest
# session cannot import together. Running `pytest` from the repository root only runs
# the `xnano` tests in `tests/`.
testpaths = ['tests']
# A runtime dropped on the wrong thread, or any error ignored by the garbage collector, is a
# bug in the code that left it behind, so it fails the test instead of printing a warning.
filterwarnings = ['error::pytest.PytestUnraisableExceptionWarning']
# Default discovery excludes common build/venv dirs only.
norecursedirs = [
    '.*',
    'build',
    'dist',
    'CVS',
    '_darcs',
    '{arch}',
    '*.egg',
    'venv',
]

#
[tool.basedpyright]
include = ['xnano', 'tests', 'packages', 'scripts', 'benchmarks', '.github/scripts']
exclude = ['**/__pycache__', '**/.venv', '**/target']
pythonVersion = '3.10'
typeCheckingMode = 'standard'
reportMissingModuleSource = false
extraPaths = ['scripts', 'tests']

[[tool.basedpyright.executionEnvironments]]
root = 'tests'
extraPaths = ['tests', 'scripts']
reportArgumentType = false
reportCallIssue = false
reportIndexIssue = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportUnusedExpression = false

[[tool.basedpyright.executionEnvironments]]
root = 'packages/xnano-core/tests'
extraPaths = ['packages/xnano-core/tests', 'scripts']
reportArgumentType = false
reportCallIssue = false
reportIndexIssue = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportUnusedExpression = false

[[tool.basedpyright.executionEnvironments]]
root = 'packages/xnano-core/benchmarks'
extraPaths = ['packages/xnano-core/benchmarks', 'scripts']
reportArgumentType = false
reportCallIssue = false
reportIndexIssue = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportUnusedExpression = false

[[tool.basedpyright.executionEnvironments]]
root = 'packages/xnano-audio/tests'
extraPaths = ['packages/xnano-audio/tests', 'scripts']
reportArgumentType = false
reportCallIssue = false
reportIndexIssue = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportUnusedExpression = false

[[tool.basedpyright.executionEnvironments]]
root = 'packages/xnano-image/tests'
extraPaths = ['packages/xnano-image/tests', 'scripts']
reportArgumentType = false
reportCallIssue = false
reportIndexIssue = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportUnusedExpression = false

[[tool.basedpyright.executionEnvironments]]
root = 'packages/xnano-audio/benchmarks'
extraPaths = ['packages/xnano-audio/benchmarks', 'scripts']
reportArgumentType = false
reportCallIssue = false
reportIndexIssue = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportUnusedExpression = false

[[tool.basedpyright.executionEnvironments]]
root = 'packages/xnano-image/benchmarks'
extraPaths = ['packages/xnano-image/benchmarks', 'scripts']
reportArgumentType = false
reportCallIssue = false
reportIndexIssue = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportUnusedExpression = false

[tool.ruff]
line-length = 90
target-version = 'py310'

[tool.ruff.format]
line-ending = 'auto'
quote-style = 'single'

[tool.ruff.lint]
preview = true
select = [
    'F',      # Pyflakes
    'E',      # pycodestyle (Error)
    'I',      # isort
    'D',      # pydocstyle
    'D213',   # multi-line docstrings start on the line after the opening quotes
    'UP',     # pyupgrade
    'YTT',    # flake8-2020
    'B',      # flake8-bugbear
    'T10',    # flake8-debugger
    'T20',    # flake8-print
    'C4',     # flake8-comprehensions
    'PERF',   # Perflint
    'PIE',    # flake8-pie
    'PYI006', # flake8-pyi
    'PYI062', # flake8-pyi
    'PYI063', # flake8-pyi
    'PYI066', # flake8-pyi
]
ignore = ['D105', 'D107', 'D205', 'D212', 'D415', 'E501', 'B011', 'B028', 'B904', 'PIE804']
flake8-quotes = {inline-quotes = 'single', multiline-quotes = 'double'}
mccabe = { max-complexity = 14 }
pydocstyle = { convention = 'google' }

[tool.ruff.lint.per-file-ignores]
# Stubs declare `__repr__` so type checkers and the stub contract tests see it.
'*.pyi' = ['PYI029']
'tests/**/*.py' = ['D']
'benchmarks/**/*.py' = ['D', 'T201']
# the new `xnano` package is empty until it is implemented.
'xnano/__init__.py' = ['D200']

[tool.ruff.lint.isort]
known-first-party = ["xnano", "xnano_core"]
known-third-party = ["xnano_audio", "xnano_image"]
# Automatic spacing (-1):
# - 1 blank line between the last runtime import and `if TYPE_CHECKING:`
# - 2 blank lines after the import / TYPE_CHECKING block before top-level
#   content (class / function / assignment)
# Forced `2` incorrectly puts two blanks *before* TYPE_CHECKING as well.
lines-after-imports = -1
no-lines-before = ["local-folder"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
