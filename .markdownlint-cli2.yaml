config:
  # Table rows and code blocks cannot wrap; prose keeps the 80-column limit.
  MD013:
    tables: false
    code_blocks: false
  # A heading may repeat under a different parent, as the two parts of a
  # design document do.
  MD024:
    siblings_only: true
  # Pages of the documentation site carry the title in the front matter, which
  # the site needs, and repeat it as the first heading.
  MD025:
    front_matter_title: ""
  # The README centers its header with a div, folds its examples into details
  # blocks and shows each rendered example as a picture that follows GitHub's
  # light or dark theme. The documentation site's markdown extension
  # (scripts/docs_markdown) adds the homepage's features and the comments on
  # code blocks.
  MD033:
    allowed_elements:
      - comments
      - definition
      - details
      - div
      - feature
      - features
      - img
      - picture
      - small
      - source
      - strong
      - summary
      - tag
# HISTORY.md is generated from the published GitHub release notes by
# scripts/history.py, so it keeps their formatting.
ignores:
  - HISTORY.md
