---
exclude_paths:
  # Rust is checked with cargo clippy across every workspace target.
  - "crates/**"
  - "Cargo.lock"
  # Tests and benchmarks assert on purpose, and run commands and subprocesses to do it.
  - "tests/**"
  - "benchmarks/**"
  - ".github/scripts/**"
  - "scripts/**"
  - "packages/*/tests/**"
  - "crates/*/tests/**"
  - "packages/*/benchmarks/**"
  - "docs/**"
  - "*.md"
  - "**/*.md"
  - "**/*.js"
  - "**/*.lock"
engines:
  lizard:
    # The public API takes many keyword-only options on purpose (open, add, img, play), and the
    # generated package exports are one long list.
    exclude_paths:
      - "xnano/terminal/__init__.py"
      - "xnano/art/_images.py"
      - "xnano/audio/_player.py"
      - "packages/xnano-core/src/xnano_core/__init__.py"
